name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: simcardiag-auto-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier la version (APK téléchargeable et mises à jour de l'appli)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimCarDiagAuto.apk
          gh release delete latest --yes --cleanup-tag || true
          NOTES=$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/d')
          gh release create "v1.0.${{ github.run_number }}" SimCarDiagAuto.apk --latest \
            --title "SimCarDiag Auto 1.0.${{ github.run_number }}" \
            --notes "$NOTES"
