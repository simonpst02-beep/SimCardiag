name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: simcardiag-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier la dernière version (APK téléchargeable)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SimCarDiag.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SimCarDiag.apk --prerelease \
            --title "SimCarDiag (dernière version)" \
            --notes "APK compilé automatiquement depuis la branche main. Ouvrez ce fichier sur le téléphone pour l'installer."
